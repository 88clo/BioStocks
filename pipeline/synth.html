    else if(io&&!io.approved&&io.imp>0&&io.imp<1&&io.ours/Math.max(io.imp,.005)>=2)add('message',72,'Today’s price implies ~'+Math.round(io.imp*100)+'% odds for '+drug+'; our read is ~'+Math.round(io.ours*100)+'%. The data isn’t landing: frame updates against the bar investors use'+(r.bench_short?' ('+wt(String(r.bench_short).split(/;/)[0],80)+')':'')+(ks(r)?' and lead with '+ks(r):'')+'.');
    else if(io&&!io.approved&&(io.imp>=1||(io.imp>0&&io.ours/io.imp<=0.6)))add('message',62,'The market prices '+drug+' above our read'+(io.imp<1?' (implied ~'+Math.round(io.imp*100)+'% odds vs our ~'+Math.round(io.ours*100)+'%)':'')+'. That premium is currency for a raise or a deal, but it is fragile: spell out what else holders are buying (next indications, platform data). ');
    else if(approved&&io.mktSales>0&&io.ourSales/io.mktSales>=1.5)add('message',66,'The market pays for only ~'+B.M(io.mktSales)+'/yr of sales against our ~'+B.M(io.ourSales)+': it doesn’t believe the ramp. ');
    else if(approved&&io.mktSales>0&&io.ourSales/io.mktSales<=0.7)add('message',58,'The market already pays for ~'+B.M(io.mktSales)+'/yr of sales vs ~'+B.M(io.run||0)+' today; guidance that bridges the gap protects the multiple. ');
    else if(nx&&typeof nx.p==='number'&&nx.p<=2&&/data|topline|readout|results|PDUFA|approval|decision|interim/i.test(nx.e||''))add('message',50,'The next catalyst ('+wt(nx.e,60)+') is guided only to '+nx.lab+'; dating it to a quarter cuts the uncertainty discount. ');
    else if((x.an!=null&&x.an<=2&&mc>3e8)||(x.sp!=null&&x.sp>=0.5&&x.sp<3&&mc>5e8&&HO[r.ticker]))add('message',40,(x.an!=null&&x.an<=2?'Only '+(x.an||'no')+' analyst'+(x.an===1?'':'s')+' cover the stock':'Healthcare specialists own only ~'+x.sp.toFixed(1)+'% of the shares')+'; a targeted specialist roadshow (and coverage added through the next deal’s syndicate) widens the buyer base. ');
    // ---------- MILESTONES
    if(typeof e==='number'&&typeof d==='number'&&e>=4&&d>=4&&io&&!io.approved&&io.y0>=4)add('miles',57,'The data clears the bar. Breakthrough designation and an early end-of-Phase 2 meeting could start the pivotal sooner; we still model ~'+io.y+' years to approval, and each year saved is worth roughly 15% of the value.');
    else if(approved&&io.run&&r.peak_sales&&io.run<.3*r.peak_sales)add('miles',58,'Investors model a '+B.M(r.peak_sales)+' peak against '+B.M(io.run)+'/yr today. Quarterly launch metrics are the milestones that will move the stock now.');
    else if(failed&&!/despite/i.test(ef)&&!approved)add('miles',45,'After a miss, the next milestone investors need is an FDA-agreed path (or a clear decision to stop), not more analysis of the failed trial.');
    var seen={},out=[];N.sort(function(a,b){return b.pri-a.pri;}).forEach(function(n){if(!seen[n.cat]){seen[n.cat]=1;out.push(n);}});
    return out;}
  function ceoHtml(r,max){var N=ceoNotes(r).slice(0,max||4);if(!N.length)return '';return '<ol class="ceo-l">'+N.map(function(n){return '<li><span class="ceo-cat">'+B.E(n.l)+'</span> '+n.t+'</li>';}).join('')+'</ol>';}
  window.ceoNotes=ceoNotes;window.ceoHtml=ceoHtml;window.CEO_CATS=CEO_CATS;

  window.SYN={supplyChart:supplyChart,ipoMarket:ipoMarket,AR:AR,drillGroups:drillGroups,drillCrumbs:drillCrumbs,upcoming:upcoming,nextCat:nextCat,clusterOf:clusterOf,clusterOrder:clusterOrder,CLCOL:CLCOL,CLUSTERS:CLUSTERS,rows:rows,events:events,thesis:thesis,fdate:fdate,sugOf:sugOf,inPort:inPort,CO:CO,big:big,lt:lt,PT:PT,HO:HO,SPEC:SPEC,NICK:NICK,J:J};
