<!-- SYNTH-START: synthesized pages (Companies, Areas, What's next, record join) — pipeline/synth.html, injected by build.py -->
<script type="application/json" id="callhist-data">{{DATA:callhist-data}}</script>
<style id="syn-css">
.syn-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 10px}
.syn-ctl input,.syn-ctl select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;color:var(--text)}
.syn-ctl .chip{background:var(--raised);border:1px solid var(--line);border-radius:14px;padding:4px 10px;font-size:11.5px;color:var(--dim);cursor:pointer}
.syn-ctl .chip.on{border-color:var(--cyan);color:var(--text);font-weight:700}
.syn-ctl .cnt{font-size:11.5px;color:var(--faint);margin-left:auto}
.syn-chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px 4px;margin:6px 0 4px}
.syn-chart svg{display:block;width:100%;height:auto}
.syn-chart text{font-family:var(--body);fill:var(--dim)}
.syn-cap{font-size:12px;color:var(--dim);margin:2px 0 12px;line-height:1.45}
.syn-th{cursor:pointer;user-select:none}.syn-th.on{color:var(--text)!important}
.syn-thesis{font-size:11.5px;color:var(--dim);line-height:1.45}
.syn-thesis b{color:var(--text);font-weight:600}
.syn-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.syn-two{grid-template-columns:1fr}}
.syn-mo{margin:16px 0 4px;display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--line);padding-bottom:4px}
.syn-mo b{font-family:var(--disp);font-size:14px}.syn-mo span{font-size:11.5px;color:var(--faint)}
.syn-ty{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.03em;padding:1px 6px;border-radius:4px;background:var(--raised);color:var(--dim);white-space:nowrap}
.syn-ty.cat{color:var(--cyan)}.syn-ty.raise{color:var(--amber)}.syn-ty.ipo{color:var(--long)}.syn-ty.lock{color:var(--short)}
.syn-dot{cursor:pointer}
#drawer .syn-top{border:1px solid var(--cyan);border-radius:10px;padding:10px 12px;background:var(--panel)}
#drawer .syn-sumrow{font-size:13px}
.syn-kvs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.syn-kv{background:var(--raised);border-radius:6px;padding:5px 8px}.syn-kv span{display:block;font-size:10px;color:var(--faint);text-transform:uppercase}.syn-kv b{font-family:var(--mono);font-size:12.5px}
.syn-dcf svg{width:100%!important;max-width:340px;height:auto!important;max-height:130px}
</style>
