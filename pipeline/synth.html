.syn-ctl .cnt{font-size:11.5px;color:var(--faint);margin-left:auto}
.syn-chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px 4px;margin:6px 0 4px}

.syn-chart text{font-family:var(--body);fill:var(--dim)}
.syn-cap{font-size:12px;color:var(--dim);margin:2px 0 12px;line-height:1.45}
.syn-th{cursor:pointer;user-select:none}.syn-th.on{color:var(--text)!important}
.syn-thesis{font-size:11.5px;color:var(--dim);line-height:1.45}
.syn-thesis b{color:var(--text);font-weight:600}
.syn-two{display:grid;grid-template-columns:1fr 1fr;gap:14px}

.syn-mo{margin:16px 0 4px;display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--line);padding-bottom:4px}
.syn-mo b{font-family:var(--disp);font-size:14px}.syn-mo span{font-size:11.5px;color:var(--faint)}
.syn-ty{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.03em;padding:1px 6px;border-radius:4px;background:var(--raised);color:var(--dim);white-space:nowrap}
.syn-ty.cat{color:var(--cyan)}.syn-ty.raise{color:var(--amber)}.syn-ty.ipo{color:var(--long)}.syn-ty.lock{color:var(--short)}
.syn-dot{cursor:pointer}

      +'<div class="syn-chart">'+areaChart(R)+'</div>'
      +'<table class="brf-t"><tr><th>Area</th>'+th('n','Names')+th('cap','Cap')+th('r1','1M')+th('r3','3M')+th('r12','12M')+th('u','Our up.')+th('su','Street up.')+th('s','Sci')+th('nl','Long')+th('ns','Short')+th('n90','Cats 90d')+th('supPct','Supply')+'<th>Read</th><th>Best longs</th></tr>'
      +R.map(function(o){return '<tr><td><b>'+B.E(o.ta)+'</b></td><td class="r">'+o.n+'</td><td class="r">'+B.M(o.cap)+'</td><td class="r '+B.PC(o.r1)+'">'+B.P(o.r1)+'</td><td class="r '+B.PC(o.r3)+'">'+B.P(o.r3)+'</td><td class="r '+B.PC(o.r12)+'">'+B.P(o.r12)+'</td><td class="r">'+B.P(o.u)+'</td><td class="r">'+B.P(o.su)+'</td><td class="r">'+(o.s==null?'—':o.s.toFixed(1))+'</td><td class="r">'+o.nl+(o.nq?' <span class="brf-q">'+o.nq+'Q</span>':'')+'</td><td class="r">'+o.ns+'</td><td class="r">'+o.n90+'</td><td class="r" title="'+B.M(o.sup)+' expected">'+(o.sup?Math.round(o.supPct)+'%':'—')+'</td><td class="sm">'+B.E(o.read)+'</td><td>'+o.top.map(B.tk).join(' ')+'</td></tr>';}).join('')+'</table>'
      +'<div class="syn-cap">Medians across the area\'s covered names. Supply = sum of likely raise sizes from the raise model as a share of the area\'s market cap. Company-level returns over 1M–36M are under the switch in the top bar.</div>';
  }
  function areasAfter(doc){doc.querySelectorAll('[data-asort]').forEach(function(h){h.onclick=function(){var k=h.dataset.asort;if(AR.sort===k)AR.dir=-AR.dir;else{AR.sort=k;AR.dir=-1;}B.rerender();};});}
  // ---------- what's next: one forward timeline ----------
  var NX={f:'all'};
  function monthKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
  function supplyMonth(x){var t=x.timing||'',d=new Date(B.today);if(/^Now/.test(t))return monthKey(d);var m=t.match(/~(\w{3}) (\d{4})/);if(m){var mi=MON.indexOf(m[1]);if(mi>=0)return m[2]+'-'+String(mi+1).padStart(2,'0');}
    d.setMonth(d.getMonth()+(/runway/.test(t)?2:3));return monthKey(d);}
  function events(){
    H();var A=rows(),E=[],end=new Date(B.today.getTime()+183*864e5);
    A.forEach(function(x){if(!x.cd)return;var d=new Date(x.cd+'T00:00:00');if(d<B.today||d>end)return;var r=x.r,c=(r.call||'').toUpperCase();
      var dir=x.side==='l'?'▲ we expect upside':x.side==='s'?'▼ we expect downside':c==='AVOID'?'▼ weak science':'· no strong view';
      var fin=x.rad&&(/catalyst/.test(x.rad.timing)||x.rad.score>=6)?'then likely raise ~'+B.M(x.rad.size)+' ('+x.rad.view.toLowerCase()+')':'';
      E.push({d:x.cd,ty:'cat',t:x.t,side:x.side,txt:r.nc||r.catalyst,call:r.call,dir:dir,fin:fin,mc:r.mc,aw:r.mktaware});});
    (B.RD.rows||[]).forEach(function(x){if(/^Now/.test(x.timing))E.push({d:monthKey(B.today)+'-'+String(B.today.getDate()).padStart(2,'0'),ty:'raise',t:x.ticker,txt:'Raise window open after run-up: ~'+B.M(x.size)+' ('+Math.round((x.size_pct||0)*100)+'% of cap)',call:x.call,dir:'',fin:x.view,mc:x.mc});});
    (IP.upcoming||[]).forEach(function(u){var d=u.expected_pricing||'';if(!d)return;E.push({d:d,ty:'ipo',t:u.ticker||u.name,txt:'IPO '+(u.name||'')+' '+(u.price_range||'')+' · '+(u.lead_asset||''),call:'',dir:'',fin:B.M(u.deal_size_usd)+' deal',mc:null});});
    (IP.recent||[]).forEach(function(r){if(!r.first_trade_date)return;var d=new Date(r.first_trade_date+'T00:00:00');d.setDate(d.getDate()+180);if(d<B.today||d>end)return;var cov=B.IDX[r.ticker]!=null?B.DA[B.IDX[r.ticker]]:null;
      E.push({d:d.toISOString().slice(0,10),ty:'lock',t:r.ticker,txt:'Lock-up ends (est.): '+r.name+', IPO $'+r.offer_price+' → now $'+r.latest_price,call:cov?cov.call:'',dir:'',fin:'insider supply',mc:null});});
    return E.sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0;});
  }
  function supply(){
    H();var S={},cur=new Date(B.today);var ks=[];for(var i=0;i<6;i++){var d=new Date(cur.getFullYear(),cur.getMonth()+i,1);ks.push(monthKey(d));}
    ks.forEach(function(k){S[k]={p:0,ps:0,x:0,ipo:0};});
    (B.RD.rows||[]).forEach(function(x){var k=supplyMonth(x);if(!S[k])return;var c=x.view==='Participate'?'p':x.view==='Price-sensitive'?'ps':'x';S[k][c]+=x.size||0;});
    (IP.upcoming||[]).forEach(function(u){var k=(u.expected_pricing||'').slice(0,7);if(S[k])S[k].ipo+=u.deal_size_usd||0;});
    return {ks:ks,S:S};
  }
  function supplyChart(){
    var o=supply(),W=980,Hh=230,ml=60,mr=10,mt=14,mb=34;var tot=o.ks.map(function(k){var s=o.S[k];return s.p+s.ps+s.x+s.ipo;});var mx=Math.max.apply(null,tot.concat([1]));
    var bw=(W-ml-mr)/o.ks.length*0.6;var X=function(i){return ml+(i+0.5)*(W-ml-mr)/o.ks.length;},Y=function(v){return Hh-mb-v/mx*(Hh-mt-mb);};
    var C=[['p','Participate','var(--long)'],['ps','Price-sensitive','var(--amber)'],['x','Pass / short','var(--short)'],['ipo','IPOs on file','var(--cyan)']];
    var g='<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Expected equity supply by month">';
    [0,.25,.5,.75,1].forEach(function(f){var v=mx*f;g+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width=".6"/><text x="'+(ml-6)+'" y="'+(Y(v)+3)+'" font-size="10.5" text-anchor="end">'+B.M(v)+'</text>';});
    o.ks.forEach(function(k,i){var s=o.S[k],y=0;C.forEach(function(c){var v=s[c[0]];if(!v)return;g+='<rect x="'+(X(i)-bw/2)+'" y="'+Y(y+v)+'" width="'+bw+'" height="'+(Y(y)-Y(y+v))+'" fill="'+c[2]+'" fill-opacity=".75"><title>'+c[1]+': '+B.M(v)+'</title></rect>';y+=v;});
      g+='<text x="'+X(i)+'" y="'+(Y(y)-5)+'" font-size="10.5" font-weight="700" text-anchor="middle" style="fill:var(--text)">'+(y?B.M(y):'')+'</text><text x="'+X(i)+'" y="'+(Hh-mb+14)+'" font-size="11" text-anchor="middle">'+MON[+k.slice(5)-1]+' '+k.slice(2,4)+'</text>';});
    var lx=ml;C.forEach(function(c){g+='<rect x="'+lx+'" y="'+(Hh-12)+'" width="10" height="10" fill="'+c[2]+'" fill-opacity=".75"/><text x="'+(lx+14)+'" y="'+(Hh-3)+'" font-size="10.5">'+c[1]+'</text>';lx+=c[1].length*6.4+34;});
    return g+'</svg>';
  }
  function nextHtml(){
    H();var E=events().filter(function(e){return NX.f==='all'||(NX.f==='calls'&&(e.side==='l'||e.side==='s'))||(NX.f==='fin'&&(e.ty!=='cat'||e.fin));});
    var by={};E.forEach(function(e){(by[e.d.slice(0,7)]=by[e.d.slice(0,7)]||[]).push(e);});var sp=supply();
    var lab={cat:'CATALYST',raise:'RAISE',ipo:'IPO',lock:'LOCK-UP'};
    var h='<div class="brf-sub"><b>Everything dated in the next six months, in order, with what we expect and what financing follows.</b> Catalysts carry our call and direction; a raise likely to follow is on the same line. Raise windows, IPOs and lock-up expiries sit in the same timeline. The chart sums the expected stock supply by month and by whether we would take an allocation.</div>'
      +'<div class="brf-h"><b>Expected biotech equity supply, next six months</b><span>Upper bound: every company the raise model flags, sized and placed in its likely month, plus IPOs on file. Year-end catalysts push many raises into January.</span></div><div class="syn-chart">'+supplyChart()+'</div>'
      +'<div class="syn-ctl">'+[['all','Everything'],['calls','Our Long / Short calls'],['fin','Financing (raises, IPOs, lock-ups)']].map(function(c){return '<span class="chip'+(NX.f===c[0]?' on':'')+'" data-nx="'+c[0]+'">'+c[1]+'</span>';}).join('')+'<span class="cnt">'+E.length+' events</span></div>';
    Object.keys(by).sort().forEach(function(k){var L=by[k],s=sp.S[k];var tot=s?s.p+s.ps+s.x+s.ipo:0;
      h+='<div class="syn-mo"><b>'+MON[+k.slice(5)-1]+' '+k.slice(0,4)+'</b><span>'+L.filter(function(e){return e.ty==='cat';}).length+' catalysts'+(tot?' · expected supply '+B.M(tot)+(s.p?' ('+B.M(s.p)+' we would join)':''):'')+'</span></div>'
        +'<table class="brf-t"><tr><th>Date</th><th>Type</th><th>Name</th><th>Call</th><th>Event</th><th>What we expect</th><th>Financing</th></tr>'
        +L.map(function(e){return '<tr><td class="r">'+fdate(e.d)+'</td><td><span class="syn-ty '+e.ty+'">'+lab[e.ty]+'</span></td><td>'+(B.IDX[e.t]!=null?B.tk(e.t):'<b>'+B.E(e.t)+'</b>')+(e.mc?'<div class="sm">'+B.M(e.mc)+'</div>':'')+'</td><td>'+(e.call?B.cb(e.call):'')+'</td><td class="sm">'+B.E(B.trunc(e.txt,120))+'</td><td class="sm">'+B.E(e.dir)+'</td><td class="sm">'+B.E(e.fin)+'</td></tr>';}).join('')+'</table>';});
    return h;
  }
  function nextAfter(doc){doc.querySelectorAll('[data-nx]').forEach(function(c){c.onclick=function(){NX.f=c.dataset.nx;B.rerender();};});}
  // ---------- record: did we have the big moves? ----------
  window.BRF_MISSES=function(){
    H();var T=B.TR||{},m=T.misses;if(!m)return '';var q=m.q4;
    var h='<div class="brf-h"><b>Did we have the big moves?</b><span>The 10 best and 10 worst moves per quarter ('+m.quarters.join(', ')+'), joined with what drove them and what we said</span></div>';
    h+='<div class="brf-note r"><b>'+q.window+':</b> our Sep 12 calls had a Long on <b>'+q.up_right+' of '+q.up_n+'</b> of the biggest gainers (most were rated Watch) and a Short or Avoid on <b>'+q.down_right+' of '+q.down_n+'</b> of the biggest losers. Across all four quarters only <b>'+m.knowable_pct+'%</b> of the big moves were clearly on a calendar beforehand; most dates could not be verified, so logging catalyst dates point-in-time is the gap to close.</div>';
    h+='<div class="syn-two"><div><table class="brf-t"><tr><th>What drove the move</th><th class="r">Moves</th><th class="r">Share</th><th class="r">Up / down</th><th class="r">Knowable beforehand</th></tr>'
      +m.by_type.map(function(b){return '<tr><td>'+B.E(b.type)+'</td><td class="r">'+b.n+'</td><td class="r">'+b.share+'%</td><td class="r">'+b.up+' / '+b.down+'</td><td class="r">'+(b.knowable_pct==null?'—':b.knowable_pct+'%')+' <span class="sm">('+b.scheduled+' sched., '+b.guided+' guided)</span></td></tr>';}).join('')+'</table></div>'
      +'<div><table class="brf-t"><tr><th>'+B.E(q.window)+'</th><th class="r">Move</th><th>Driver</th><th>Our Sep 12 call</th></tr>'
      +q.rows.map(function(r){return '<tr><td>'+B.tk(r.t)+'</td><td class="r '+B.PC(r.ret)+'">'+B.P(r.ret)+'</td><td class="sm">'+B.E(r.type)+'</td><td>'+(r.sep_call?B.cb(r.sep_call):'<span class="sm">not covered</span>')+(r.right===true?' <span class="brf-pos">✓</span>':r.right===false?' <span class="brf-neg">✗</span>':'')+'</td></tr>';}).join('')+'</table></div></div>';
    h+='<div class="brf-note g"><b>What this says.</b> Data readouts drive almost half of the biggest moves in both directions, so the calendar is where the edge has to come from. M&A, financing and short reports are never on a calendar, so position sizing, not prediction, handles them. The Watch bucket produced most of the big winners: strong science that was not yet cheap.</div>';
    return h;
  };
  window.BRF_PAGES=window.BRF_PAGES||{};
  window.BRF_PAGES.co={html:coHtml,after:coAfter};
  window.BRF_PAGES.areas={html:areasHtml,after:function(d){areasAfter(d);}};
  window.BRF_PAGES.next={html:nextHtml,after:nextAfter};
})();
</script>
