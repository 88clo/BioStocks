<style id="syn2-css">
.pr-why{display:flex;flex-wrap:wrap;gap:3px}.pr-why span{font-size:9.5px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--raised);color:var(--dim);white-space:nowrap}

#drawer .syn-nav{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;flex-wrap:wrap;gap:4px;padding:6px 0 8px;border-bottom:1px solid var(--line);margin-bottom:8px}
#drawer .syn-nav button{background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:3px 9px;font-size:11px;color:var(--dim);cursor:pointer}
#drawer .syn-nav button.op{border-color:var(--cyan);color:var(--cyan);font-weight:700}
.val-two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.val-two>div{background:var(--raised);border-radius:8px;padding:8px 10px}
.val-two b{font-family:var(--mono);font-size:15px}.val-two .l{font-size:10.5px;text-transform:uppercase;color:var(--faint)}
.val-in{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0;font-size:12px}

.sens td,.sens th{text-align:center!important;font-family:var(--mono);font-size:11px}.sens td.base{outline:2px solid var(--cyan)}
#onepager{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.45);display:none;overflow:auto}
#onepager.open{display:block}
#onepager .op-doc{background:#fff;color:#111;max-width:820px;margin:30px auto;padding:34px 40px;border-radius:8px;font:13px/1.5 Georgia,serif}
#onepager .op-doc h1{font:700 22px/1.2 var(--disp,Arial);margin:0 0 2px}#onepager .op-doc h2{font:700 13px/1.2 Arial;text-transform:uppercase;letter-spacing:.06em;color:#555;margin:18px 0 6px;border-bottom:1px solid #ddd;padding-bottom:3px}
#onepager table{width:100%;border-collapse:collapse;font:11.5px/1.35 Arial}#onepager td,#onepager th{border-bottom:1px solid #eee;padding:4px 5px;text-align:left;vertical-align:top}
#onepager .op-bar{max-width:820px;margin:16px auto -18px;display:flex;gap:8px;justify-content:flex-end}
#onepager .op-bar button{background:#fff;border:1px solid #bbb;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:700}
@media print{body.op-print>*:not(#onepager){display:none!important}body.op-print #onepager{position:static;background:none;display:block}body.op-print .op-bar{display:none}body.op-print .op-doc{margin:0;max-width:none;box-shadow:none}}
.rot-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.ww-ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 8px}.ww-ctl select{font:inherit;font-size:12px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}.ww-lbl{font-size:11.5px;color:var(--dim)}.ww-scroll{overflow-x:auto}.ww-t td,.ww-t th{white-space:nowrap;font-variant-numeric:tabular-nums;font-size:12px;padding:5px 8px}.ww-t .ww-per{border-left:2px solid var(--line);font-weight:700}.ww-t tr.ww-u td{color:var(--dim);border-top:1px solid var(--line)}.ww-flag{font-size:10px;font-weight:600;color:var(--amber);background:var(--amber-bg);border-radius:999px;padding:0 6px;margin-left:4px;text-transform:none;letter-spacing:0}
.ns-doc{max-width:1100px;font-size:13.5px;line-height:1.55}.ns-doc h2.ns-h1{font-size:22px;margin:4px 0 10px}.ns-doc h3.ns-h2{font-size:15px;margin:22px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}.ns-doc ol,.ns-doc ul{padding-left:22px;margin:6px 0}.ns-doc li{margin:4px 0}.ns-doc .ns-t td,.ns-doc .ns-t th{vertical-align:top;font-size:12.5px;padding:6px 9px}.ns-doc .ns-t td:last-child b{color:var(--amber)}.ns-doc p{margin:6px 0}
.rot-l{transition:stroke-opacity .1s}.rot-leg{display:flex;flex-wrap:wrap;gap:4px 6px;padding:8px 2px 6px;border-top:1px solid var(--line-soft);margin-top:4px}.rot-li{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;cursor:pointer;user-select:none;color:var(--text)}.rot-li i{width:14px;height:3px;border-radius:2px;flex:none}.rot-li b{font-weight:600;color:var(--dim)}.rot-li:hover,.rot-li.on{border-color:var(--text);background:var(--raised)}.rot-l:hover{stroke-opacity:1!important;stroke-width:3px!important}
.rot-ctl select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px;color:var(--text)}
</style>

<script id="syn2-js">
(function(){
  var B=function(){return window.BRF;},S=function(){return window.SYN;};
  var CHG=(function(){try{var e=document.getElementById('changes-data');return e&&e.textContent.trim()?JSON.parse(e.textContent):null;}catch(err){return null;}})();
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  // ================= 1. Priority list (top of What's next) =================
  function partner(x){var b=B(),A=S().rows();var same=A.filter(function(y){return y.t!==x.t&&y.side==='l'&&y.r.indgroup&&y.r.indgroup===x.r.indgroup;});
    if(!same.length)same=A.filter(function(y){return y.t!==x.t&&y.side==='l'&&y.r.ta===x.r.ta;});
    same.sort(function(a,c){return (b.quality(c.r)?1:0)-(b.quality(a.r)?1:0)||(c.u||0)-(a.u||0);});return same[0]?same[0].t:null;}
  function priority(asMap){
    var b=B(),A=S().rows(),now=b.today,out=[];
    A.forEach(function(x){var r=x.r,c=(r.call||'').toUpperCase();if(x.side!=='l'&&x.side!=='s')return;
      var d=null,ex=x.nx&&(x.nx.p||0)>=5;if(x.nx){d=Math.round((new Date(x.nx.d+'T00:00:00')-now)/864e5);if(d>183)d=null;else d=Math.max(0,d);}var dl=function(){return ex?d+'d to event':'due within '+d+'d';};
      var openRaise=x.rad&&/^Now/.test(x.rad.timing)&&x.rad.view==='Participate';

      var why=[],sc=0,adv=r.adv||0;
      var strong=(c==='STRONG BUY'||c==='STRONG SHORT');sc+=strong?3:2;why.push(strong?'strong call':'call');
      if(x.side==='l'&&b.quality(r)){sc+=2;why.push('quality');}
      if(x.s!=null&&((x.side==='l'&&x.s>=3.5)||(x.side==='s'&&x.s<2.5))){sc+=1;why.push(x.side==='l'?'strong science':'weak science');}
      var u=x.out?1000:x.u;if(u!=null){var v=x.side==='l'?Math.min(3,Math.log10(1+Math.max(0,u)/100)*2):Math.min(3,Math.max(0,-u)/30);sc+=v;if(v>=1.5)why.push(x.side==='l'?'deep value':'rich');}
      if(x.side==='l'&&x.gap!=null&&x.gap>100&&x.an>=3){sc+=1;why.push('more bullish than Street');}
      if(x.side==='s'&&x.su!=null&&x.su>100){sc+=.5;why.push('contrarian to Street');}
      if(d!=null){if(d>=7&&d<=90){sc+=2;why.push(dl());}else if(d<7){sc+=1;why.push(dl());}else{sc+=1;why.push(dl());}}

      if(adv>=5e6){sc+=1;why.push('liquid');}else if(adv<1e6){sc-=2;why.push('illiquid');}

      var act,pt=null;

        if(x.rad&&/catalyst/.test(x.rad.timing)&&d!=null)act+=', add in the follow-on if data is good';}
      else{pt=partner(x);act='Short or avoid into '+(d!=null?x.nx.lab:'the raise')+(pt?' · pair vs '+pt:'')+(x.rad?' · raise likely, adds pressure':'');}
      if(adv<1e6)act+=' · size small (ADV '+b.M(adv)+')';
      out.push({x:x,sc:sc,why:why,act:act,d:d});});
    out.sort(function(a,c){return c.sc-a.sc;});
    var L=out.filter(function(o){return o.x.side==='l';}).slice(0,12).concat(out.filter(function(o){return o.x.side==='s';}).slice(0,5));
    if(asMap){var M={};L.forEach(function(o,i){M[o.x.t]={rank:i+1,act:o.act,why:o.why,sc:o.sc,side:o.x.side};});return M;}
    return '<div class="brf-h"><b>Priority list: what to act on in the next six months</b><span>'+out.length+' candidates ranked · top 12 longs, then top 5 shorts</span></div>'
      +'<table class="brf-t"><tr><th>#</th><th>Name</th><th>Call</th><th>What to do</th><th>Event</th><th>Why it ranks</th><th class="r">Ours / Street</th><th class="r">Score</th></tr>'
      +L.map(function(o,i){var x=o.x,r=x.r;return (i>0&&x.side==='s'&&L[i-1].x.side==='l'?'<tr><td colspan="8" style="background:var(--raised);font-weight:700;font-size:11px">Shorts and avoids</td></tr>':'')+'<tr><td class="r">'+(i+1)+'</td><td>'+b.tk(x.t)+'<div class="sm">'+b.E(b.trunc(r.nick||r.name,18))+' · '+b.M(r.mc)+'</div></td><td>'+b.cb(r.call)+'</td><td class="pr-act">'+b.E(o.act)+'</td><td class="sm">'+(x.nx&&o.d!=null?'<b>'+(x.nx.k?'★ ':'')+b.E(x.nx.lab)+'</b> '+b.E(b.trunc(x.nx.e,80)):b.E(b.trunc(r.nc||r.catalyst,80)))+'</td><td><div class="pr-why">'+o.why.map(function(w){return '<span>'+b.E(w)+'</span>';}).join('')+'</div></td><td class="r">'+(x.out?'⚠ ':'')+'<span class="'+b.PC(x.u)+'">'+b.P(x.u)+'</span> / <span class="'+b.PC(x.su)+'">'+b.P(x.su)+'</span></td><td class="r">'+o.sc.toFixed(1)+'</td></tr>';}).join('')+'</table>'
      +'<div class="syn-cap">Score = call strength (Strong 3, else 2) + quality long 2 + science fit 1 + value (up to 3, upside capped at +1,000%) + more bullish than Street 1 (3+ analysts) + timing (next catalyst due in 7–90 days 2, sooner or later 1; for a 4Q26-style window the clock runs to the end of the window) + open raise window 1.5 + liquidity (ADV ≥$5M +1, <$1M −2), minus 1 for implausible upside. A rules-based queue to start the week with, not a portfolio.</div>';
  }
  // ================= 6b. What changed since the last refresh (Brief) =================
  window.BRF_CHANGES=function(){var b=B();if(!CHG||!b)return '';
    var up=function(c){return (c||'').replace('STRONG ','S.');};
    var calls=CHG.calls.slice().sort(function(a,c){var o={'STRONG BUY':0,'LONG':1,'STRONG SHORT':2,'SHORT':3};return (o[a.to]==null?9:o[a.to])-(o[c.to]==null?9:o[c.to]);});
    return '<div class="brf-h"><b>Changed since the last refresh</b><span>'+b.E(CHG.from.slice(0,10))+' → '+b.E(CHG.to.slice(0,10))+'</span></div><div class="brf-note">'
      +'<b>'+CHG.calls.length+' call changes:</b> '+calls.slice(0,12).map(function(c){return b.tk(c.t)+' '+up(c.from)+'→<b>'+up(c.to)+'</b>';}).join(', ')+(calls.length>12?' +'+(calls.length-12)+' more':'')
      +'<br><b>Biggest moves:</b> '+CHG.moves.slice(0,8).map(function(m){return b.tk(m.t)+' <span class="'+b.PC(m.r)+'">'+b.P(m.r)+'</span>';}).join(', ')
      +(CHG.catalysts.length?'<br><b>Catalyst dates moved:</b> '+CHG.catalysts.slice(0,8).map(function(c){return b.tk(c.t)+' '+b.E(c.from||'—')+'→'+b.E(c.to||'—');}).join(', '):'<br><b>Catalyst dates moved:</b> none')
      +(CHG.new.length?'<br><b>Added:</b> '+CHG.new.map(b.tk).join(' '):'')+(CHG.dropped.length?'<br><b>Dropped:</b> '+CHG.dropped.map(function(t){return b.E(t);}).join(' '):'')+'</div>';};
  // ================= 5. Returns over time (top of Areas) =================
  var ROT={hide:{},hl:'',per:12,sel:null};   // per = quarters shown (2 = 6 months ... 12 = 3 years)
  function series(filter){var P=(S().J('priceq-baked')||{}),Q=P.quarters||[],PR=P.prices||{};var n=Q.length,start=Math.max(1,n-ROT.per);var idx=[100],labs=[Q[start-1]];
    var tks=B().DA.filter(filter).map(function(r){return r.ticker;});
    for(var i=start;i<n;i++){var rs=[];tks.forEach(function(t){var a=(PR[t]||[])[i-1],c=(PR[t]||[])[i];if(a>0&&c>0)rs.push(c/a);});var m=B().med(rs)||1;idx.push(idx[idx.length-1]*m);labs.push(Q[i]);}
    return {idx:idx,labs:labs};}
  function benchSeries(k){var T=B().TR||{},bq=T.bench_q;if(!bq)return null;var Q=bq.quarters,n=Q.length,start=Math.max(1,n-ROT.per),base=bq[k][start-1];if(!base)return null;var o=[100];for(var i=start;i<n;i++)o.push(bq[k][i]?bq[k][i]/base*100:null);return o;}
  function rotChart(){var b=B(),s=S(),U=series(function(r){return r.ta!=='Acquired / Inactive';}),X=benchSeries('XBI');
    var D=s.drillGroups(),lines;
    if(D.lev===3){   // one indication group: every company's line, the group median highlighted
      var P=(s.J('priceq-baked')||{}),Q=P.quarters||[],PR=P.prices||{},n0=Q.length,st=Math.max(1,n0-ROT.per);
      var col={l:'var(--long)',s:'var(--short)',a:'var(--amber)',n:'var(--faint)'},X0={};s.rows().forEach(function(x){X0[x.t]=x;});
      lines=D.items.map(function(it){var r=it.r,pr=PR[r.ticker]||[],base=null,v=[];for(var i=st-1;i<n0;i++){var p=pr[i];if(base==null&&p>0)base=p;v.push(base&&p>0?p/base*100:null);}var x=X0[r.ticker];return {l:r.ticker,v:v,c:col[x?x.side:'n'],w:1.6,o:.8,dk:r.ticker,dl:'co'};}).filter(function(l){return l.v.some(function(v){return v!=null;});});
    }else lines=D.items.map(function(it){return {l:it.label,v:series(it.f).idx,c:it.c,w:D.lev?1.8:2,o:.8,dk:it.key,dl:it.lev};});
    if(D.parent)lines.push({l:D.parent.label+' median',v:series(D.parent.f).idx,c:D.parent.c,w:4,o:.45});
    lines.push({l:'Universe median',v:U.idx,c:'var(--text)',w:2.5,o:1});if(X)lines.push({l:'XBI',v:X,c:'var(--cyan)',w:2.5,o:1,dash:'6 4'});
    var pct=function(v){return Math.round(v-100);};
    var all=[].concat.apply([],lines.map(function(l){return l.v.filter(function(v){return v!=null;});}));var lo=Math.max(10,Math.min.apply(null,all)),hi=Math.min(400,Math.max.apply(null,all));
    var lo2=Math.floor((lo-100)/20)*20+100,hi2=Math.ceil((hi-100)/20)*20+100;
    var W=1180,Hh=380,ml=52,mr=190,mt=12,mb=30,n=U.labs.length;var Xp=function(i){return ml+i/(n-1)*(W-ml-mr);},Yp=function(v){return Hh-mb-(Math.max(lo2,Math.min(hi2,v))-lo2)/(hi2-lo2)*(Hh-mt-mb);};
    var g='<svg viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Returns over time by area">';
    var step=(hi2-lo2)>200?50:20;for(var v=lo2;v<=hi2;v+=step)g+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+Yp(v)+'" y2="'+Yp(v)+'" stroke="var(--line)" stroke-width="'+(v===100?1.6:.6)+'"/><text x="'+(ml-6)+'" y="'+(Yp(v)+3)+'" font-size="10.5" text-anchor="end">'+(pct(v)>0?'+':'')+pct(v)+'%</text>';
    U.labs.forEach(function(q,i){if(n<=6||i%2===0||i===n-1)g+='<text x="'+Xp(i)+'" y="'+(Hh-mb+14)+'" font-size="10.5" text-anchor="middle">'+q+'</text>';});
    var ends=[];ROT._leg=[];lines.forEach(function(l,li){var d='';l.v.forEach(function(v,i){if(v==null)return;d+=(d?'L':'M')+Xp(i).toFixed(1)+' '+Yp(v).toFixed(1);});var lv=l.v[l.v.length-1];
      ROT._leg.push({i:li,l:l.l,c:l.c,v:l.v[l.v.length-1],dk:l.dk,dl:l.dl,dash:l.dash});
      g+='<path class="rot-l" data-li="'+li+'" '+(l.dk?'data-dk="'+b.E(l.dk)+'" data-dl="'+l.dl+'"':'')+' d="'+d+'" fill="none" stroke="'+l.c+'" stroke-opacity="'+l.o+'" stroke-width="'+l.w+'"'+(l.dash?' stroke-dasharray="'+l.dash+'"':'')+'><title>'+b.E(l.l)+': '+(lv!=null?(pct(lv)>0?'+':'')+pct(lv)+'%':'')+' over the period</title></path>';
      if(lv!=null)ends.push({y:Yp(lv),v:lv,t:l.l,c:l.c,main:!l.dk});});
    var areas=ends.filter(function(e){return !e.main;}).sort(function(a,c){return c.v-a.v;});var lab=ends.filter(function(e){return e.main;}).concat(areas.length<=12?areas:areas.slice(0,5).concat(areas.slice(-5)));
    lab=lab.filter(function(e,i,a){return a.indexOf(e)===i;}).sort(function(a,c){return a.y-c.y;});for(var i=1;i<lab.length;i++)if(lab[i].y-lab[i-1].y<12)lab[i].y=lab[i-1].y+12;var over=lab.length?lab[lab.length-1].y-(Hh-mb-16):0;if(over>0)for(var j=lab.length-1;j>=0;j--){lab[j].y-=over;if(j>0&&lab[j].y-lab[j-1].y>=12)break;}
    lab.forEach(function(e){g+='<text class="rot-et" data-lt="'+b.E(e.t)+'" x="'+(W-mr+6)+'" y="'+(e.y+3)+'" font-size="10.5" font-weight="'+(e.main?800:600)+'" style="fill:'+(e.main?(e.t==='XBI'?'var(--cyan)':'var(--text)'):e.c)+'">'+b.E(e.t.length>20?e.t.slice(0,19)+'…':e.t)+' '+(pct(e.v)>0?'+':'')+pct(e.v)+'%</text>';});
    return g+'</svg>';}
  function rotHtml(){var b=B(),s=S();var AR=s.AR;
    var tog='<div class="syn-ctl" style="margin-bottom:10px"><span class="syn-seg">'+[['hist','Historical: returns over time'],['fut','Future: value vs momentum']].map(function(o){return '<button data-aview="'+o[0]+'" class="'+(AR.view===o[0]?'on':'')+'">'+o[1]+'</button>';}).join('')+'</span></div>';
    if(AR.view==='fut')return tog;
    var tas=Array.from(new Set(b.DA.map(function(r){return r.ta;}))).filter(function(t){return t&&t!=='Acquired / Inactive';}).sort();
    return tog+'<div class="brf-h"><b>'+'Returns over time: '+(['every cluster','areas in '+b.E(s.AR.dr.cl),'indication groups in '+b.E(s.AR.dr.ta),'companies in '+b.E(s.AR.dr.ig)][s.AR.dr.ig?3:s.AR.dr.ta?2:s.AR.dr.cl?1:0])+' vs XBI and the median covered stock'+'</b><span>Cumulative % return over '+({2:'six months',4:'one year',8:'two years',12:'three years'})[ROT.per]+' · quarter-end closes · group lines chain their median stock\'s quarterly return (equal-weight); company lines are coloured by our call (green long, red short, amber avoid)</span></div>'
      +'<div class="rot-ctl">'+s.drillCrumbs()+' <span class="syn-seg">'+[[2,'6M'],[4,'1Y'],[8,'2Y'],[12,'3Y']].map(function(o){return '<button data-rper="'+o[0]+'" class="'+(ROT.per===o[0]?'on':'')+'">'+o[1]+'</button>';}).join('')+'</span>'+'</div>'
      +'<div class="syn-chart">'+rotChart()+rotLegend()+'</div>';}
  function rotLegend(){var b=B(),L=(ROT._leg||[]).slice().sort(function(a,c){var m=function(x){return x.dk?0:1;};return m(c)-m(a)||(c.v==null?-1e9:c.v)-(a.v==null?-1e9:a.v);});
    return '<div class="rot-leg">'+L.map(function(x){var pv=x.v==null?'':' '+((x.v-100)>0?'+':'')+Math.round(x.v-100)+'%';return '<span class="rot-li'+(ROT.sel===x.i?' on':'')+'" data-li="'+x.i+'"'+(x.dk?' data-dk="'+b.E(x.dk)+'" data-dl="'+x.dl+'"':'')+' title="'+(x.dl==='co'?'Click for the card':x.dk?'Click to drill in':'Hover to highlight')+'"><i style="background:'+x.c+(x.dash?';background:repeating-linear-gradient(90deg,'+x.c+' 0 5px,transparent 5px 8px)':'')+'"></i>'+b.E(x.l)+'<b>'+pv+'</b></span>';}).join('')+'</div>';}

    var K=Object.keys(keys);if(F.order)K.sort(function(a,b){var i=F.order.indexOf(a),j=F.order.indexOf(b);return (i<0?99:i)-(j<0?99:j);});else K.sort(function(a,b){return (med(per[b]||[])||-9)-(med(per[a]||[])||-9);});

  function pct(v){return v==null?'—':(v>0?'+':'')+Math.round(v*100)+'%';}
  function bg(v,sc){if(v==null)return '';var a=Math.min(1,Math.abs(v)/sc)*.55;return 'background:'+(v>0?'rgba(34,160,90,'+a+')':'rgba(214,69,69,'+a+')');}
  function html(){var c=compute();if(!c)return '';var b=H(),E=b.E;
    var opt=function(sel,i){return c.Q.map(function(q,j){return j<1?'':'<option value="'+j+'"'+(j===sel?' selected':'')+'>'+q+'</option>';}).join('');};
    var h='<div class="brf-h"><b>What worked, quarter by quarter</b><span>Median return of each group in each quarter'+(WW.rel?', minus the median of every covered stock that quarter':'')+'. Pick any window: an idea that worked in 2Q24 can fail in 3Q25.</span></div>';
    h+='<div class="ww-ctl"><select id="wwF">'+Object.keys(FACT).map(function(k){return '<option value="'+k+'"'+(k===WW.f?' selected':'')+'>'+E(FACT[k].l)+'</option>';}).join('')+'</select>'
      +' <span class="syn-seg"><button data-wwrel="1" class="'+(WW.rel?'on':'')+'">vs universe</button><button data-wwrel="0" class="'+(WW.rel?'':'on')+'">absolute</button></span>'
      +' <span class="ww-lbl">From</span><select id="wwA">'+opt(WW.a)+'</select><span class="ww-lbl">to</span><select id="wwB">'+opt(WW.b)+'</select>'
      +' <span class="syn-seg">'+[[4,'1Y'],[8,'2Y'],[12,'3Y'],[24,'6Y']].map(function(p){return '<button data-wwp="'+p[0]+'"'+(WW.b-WW.a+1===p[0]&&WW.b===c.Q.length-1?' class="on"':'')+'>'+p[1]+'</button>';}).join('')+'</span></div>';
    var sc=WW.rel?.25:.4;
    h+='<div class="ww-scroll"><table class="brf-t ww-t"><tr><th>'+E(c.F.l)+(c.F.bias?' <span class="ww-flag" title="'+E(c.F.bias)+'">biased, hover</span>':c.F.pit?'':' <span class="ww-flag" title="Grouped by today\'s label, which uses information that was not known at the time. Read as description, not as a tradable signal.">today\'s label</span>')+'</th>'+c.cols.map(function(q){return '<th class="r">'+c.Q[q]+'</th>';}).join('')+'<th class="r ww-per">Whole window</th><th class="r">Beat universe</th></tr>';
    c.K.forEach(function(k){var wins=0,nq=0;
      h+='<tr><td><b>'+E(k)+'</b></td>'+c.cols.map(function(q){var L=c.cells[k+'|'+q]||[],m=med(L),v=m==null?null:(WW.rel?m-c.uni[q]:m);if(m!=null&&c.uni[q]!=null){nq++;if(m>c.uni[q])wins++;}return '<td class="r" style="'+bg(v,sc)+'" title="'+E(k)+' · '+c.Q[q]+' · n='+L.length+' · group '+pct(m)+' · universe '+pct(c.uni[q])+'">'+pct(v)+'</td>';}).join('');
      var pm=med(c.per[k]||[]),pv=pm==null?null:(WW.rel?pm-c.perU:pm);
      h+='<td class="r ww-per" style="'+bg(pv,WW.rel?.5:.8)+'" title="n='+((c.per[k]||[]).length)+' · bucket set at the start of the window">'+pct(pv)+'</td><td class="r">'+(nq?wins+'/'+nq:'—')+'</td></tr>';});
    h+='<tr class="ww-u"><td>Universe median</td>'+c.cols.map(function(q){return '<td class="r">'+pct(c.uni[q])+'</td>';}).join('')+'<td class="r ww-per">'+pct(c.perU)+'</td><td></td></tr></table></div>';
    // lesson
    var rk=c.K.map(function(k){var m=med(c.per[k]||[]);var w=0,nq=0;c.cols.forEach(function(q){var mm=med(c.cells[k+'|'+q]||[]);if(mm!=null&&c.uni[q]!=null){nq++;if(mm>c.uni[q])w++;}});return {k:k,m:m==null?null:(WW.rel?m-c.perU:m),w:w,nq:nq,n:(c.per[k]||[]).length};}).filter(function(o){return o.m!=null&&o.n>=5;}).sort(function(a,b){return b.m-a.m;});
    if(rk.length>1){var best=rk[0],worst=rk[rk.length-1];
      h+='<div class="brf-note"><b>Lesson for '+c.Q[WW.a]+'–'+c.Q[WW.b]+':</b> '+E(best.k)+' did best ('+pct(best.m)+(WW.rel?' vs the universe':'')+' over the window, beat the universe in '+best.w+' of '+best.nq+' quarters); '+E(worst.k)+' did worst ('+pct(worst.m)+', beat it in '+worst.w+' of '+worst.nq+'). Spread '+Math.round((best.m-worst.m)*100)+' points. '+(best.w/Math.max(1,best.nq)>=.7?'Consistent: it held in most quarters, so treat it as a regime, not luck.':best.w/Math.max(1,best.nq)<=.5?'Inconsistent: most of the gap came from a few quarters, so check what happened in those before acting on it.':'Fairly consistent, with some quarters going the other way.')+(c.F.bias?' Caution: '+E(c.F.bias):c.F.pit?'':' Grouped by today\'s labels, so this describes the past rather than proving a signal.')+'</div>';}
    h+='<div class="syn-cap">Includes names since acquired or delisted while they traded, which reduces survivorship bias. Quarter-end closes; the latest quarter runs to the last close. '+'Every group comes from today\'s covered list (plus acquired names), so names that were too small to cover then but grew are included. '+'Hover a cell for the group size and the raw returns.</div>';
    return '<div class="ww-wrap">'+h+'</div>';}
  function after(doc){var host=doc.querySelector('.ww-wrap');if(!host)return;var re=function(){host.outerHTML=html();after(doc);};
    var f=doc.querySelector('#wwF');if(f)f.onchange=function(){WW.f=f.value;re();};
    doc.querySelectorAll('[data-wwrel]').forEach(function(bt){bt.onclick=function(){WW.rel=+bt.dataset.wwrel;re();};});
    var A=doc.querySelector('#wwA'),Bq=doc.querySelector('#wwB');
    if(A)A.onchange=function(){WW.a=+A.value;if(WW.a>WW.b)WW.b=WW.a;re();};
    if(Bq)Bq.onchange=function(){WW.b=+Bq.value;if(WW.b<WW.a)WW.a=WW.b;re();};
    doc.querySelectorAll('[data-wwp]').forEach(function(bt){bt.onclick=function(){var n=data().Q.length;WW.b=n-1;WW.a=Math.max(1,n-+bt.dataset.wwp);re();};});}
  window.WW_HTML=html;window.WW_AFTER=after;
})();
</script>
