<script id="syn2-js">
(function(){
  var B=function(){return window.BRF;},S=function(){return window.SYN;};
  var CHG=(function(){try{var e=document.getElementById('changes-data');return e&&e.textContent.trim()?JSON.parse(e.textContent):null;}catch(err){return null;}})();
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  // ================= 1. Priority list (top of What's next) =================
  function partner(x){var b=B(),A=S().rows();var same=A.filter(function(y){return y.t!==x.t&&y.side==='l'&&y.r.indgroup&&y.r.indgroup===x.r.indgroup;});
    if(!same.length)same=A.filter(function(y){return y.t!==x.t&&y.side==='l'&&y.r.ta===x.r.ta;});
    same.sort(function(a,c){return (b.quality(c.r)?1:0)-(b.quality(a.r)?1:0)||(c.u||0)-(a.u||0);});return same[0]?same[0].t:null;}
  function priority(asMap){
    var b=B(),A=S().rows(),now=b.today,out=[];
    A.forEach(function(x){var r=x.r,c=(r.call||'').toUpperCase();if(x.side!=='l'&&x.side!=='s')return;
      var d=null,ex=x.nx&&(x.nx.p||0)>=5;if(x.nx){d=Math.round((new Date(x.nx.d+'T00:00:00')-now)/864e5);if(d>183)d=null;else d=Math.max(0,d);}var dl=function(){return ex?d+'d to event':'due within '+d+'d';};
      var openRaise=x.rad&&/^Now/.test(x.rad.timing)&&x.rad.view==='Participate';
      if(d==null&&!openRaise)return;
      var why=[],sc=0,adv=r.adv||0;
      var strong=(c==='STRONG BUY'||c==='STRONG SHORT');sc+=strong?3:2;why.push(strong?'strong call':'call');
      if(x.side==='l'&&b.quality(r)){sc+=2;why.push('quality');}
      if(x.s!=null&&((x.side==='l'&&x.s>=3.5)||(x.side==='s'&&x.s<2.5))){sc+=1;why.push(x.side==='l'?'strong science':'weak science');}
      var u=x.out?1000:x.u;if(u!=null){var v=x.side==='l'?Math.min(3,Math.log10(1+Math.max(0,u)/100)*2):Math.min(3,Math.max(0,-u)/30);sc+=v;if(v>=1.5)why.push(x.side==='l'?'deep value':'rich');}
      if(x.side==='l'&&x.gap!=null&&x.gap>100&&x.an>=3){sc+=1;why.push('more bullish than Street');}
      if(x.side==='s'&&x.su!=null&&x.su>100){sc+=.5;why.push('contrarian to Street');}
      if(d!=null){if(d>=7&&d<=90){sc+=2;why.push(dl());}else if(d<7){sc+=1;why.push(dl());}else{sc+=1;why.push(dl());}}
      if(openRaise){sc+=1.5;why.push('raise window open');}
      if(adv>=5e6){sc+=1;why.push('liquid');}else if(adv<1e6){sc-=2;why.push('illiquid');}
      if(x.out){sc-=1;why.push('⚠ check upside');}
      var act,pt=null;
      if(x.side==='l'){act=openRaise&&d==null?'Ask for an allocation in the raise':(d!=null&&d<7?'Decide now: '+(ex?'event in '+d+' days':'due by '+S().fdate(x.nx.d)):'Build before '+x.nx.lab);
        if(x.rad&&/catalyst/.test(x.rad.timing)&&d!=null)act+=', add in the follow-on if data is good';}
      else{pt=partner(x);act='Short or avoid into '+(d!=null?x.nx.lab:'the raise')+(pt?' · pair vs '+pt:'')+(x.rad?' · raise likely, adds pressure':'');}
      if(adv<1e6)act+=' · size small (ADV '+b.M(adv)+')';
      out.push({x:x,sc:sc,why:why,act:act,d:d});});
    out.sort(function(a,c){return c.sc-a.sc;});
    var L=out.filter(function(o){return o.x.side==='l';}).slice(0,12).concat(out.filter(function(o){return o.x.side==='s';}).slice(0,5));
    if(asMap){var M={};L.forEach(function(o,i){M[o.x.t]={rank:i+1,act:o.act,why:o.why,sc:o.sc,side:o.x.side};});return M;}
    return '<div class="brf-h"><b>Priority list: what to act on in the next six months</b><span>'+out.length+' candidates ranked · top 12 longs, then top 5 shorts</span></div>'
      +'<table class="brf-t"><tr><th>#</th><th>Name</th><th>Call</th><th>What to do</th><th>Event</th><th>Why it ranks</th><th class="r">Ours / Street</th><th class="r">Score</th></tr>'
      +L.map(function(o,i){var x=o.x,r=x.r;return (i>0&&x.side==='s'&&L[i-1].x.side==='l'?'<tr><td colspan="8" style="background:var(--raised);font-weight:700;font-size:11px">Shorts and avoids</td></tr>':'')+'<tr><td class="r">'+(i+1)+'</td><td>'+b.tk(x.t)+'<div class="sm">'+b.E(b.trunc(r.nick||r.name,18))+' · '+b.M(r.mc)+'</div></td><td>'+b.cb(r.call)+'</td><td class="pr-act">'+b.E(o.act)+'</td><td class="sm">'+(x.nx&&o.d!=null?'<b>'+(x.nx.k?'★ ':'')+b.E(x.nx.lab)+'</b> '+b.E(b.trunc(x.nx.e,80)):b.E(b.trunc(r.nc||r.catalyst,80)))+'</td><td><div class="pr-why">'+o.why.map(function(w){return '<span>'+b.E(w)+'</span>';}).join('')+'</div></td><td class="r">'+(x.out?'⚠ ':'')+'<span class="'+b.PC(x.u)+'">'+b.P(x.u)+'</span> / <span class="'+b.PC(x.su)+'">'+b.P(x.su)+'</span></td><td class="r">'+o.sc.toFixed(1)+'</td></tr>';}).join('')+'</table>'
      +'<div class="syn-cap">Score = call strength (Strong 3, else 2) + quality long 2 + science fit 1 + value (up to 3, upside capped at +1,000%) + more bullish than Street 1 (3+ analysts) + timing (next catalyst due in 7–90 days 2, sooner or later 1; for a 4Q26-style window the clock runs to the end of the window) + open raise window 1.5 + liquidity (ADV ≥$5M +1, <$1M −2), minus 1 for implausible upside. A rules-based queue to start the week with, not a portfolio.</div>';
  }
  // ================= 6b. What changed since the last refresh (Brief) =================
  window.BRF_CHANGES=function(){var b=B();if(!CHG||!b)return '';
    var up=function(c){return (c||'').replace('STRONG ','S.');};
    var calls=CHG.calls.slice().sort(function(a,c){var o={'STRONG BUY':0,'LONG':1,'STRONG SHORT':2,'SHORT':3};return (o[a.to]==null?9:o[a.to])-(o[c.to]==null?9:o[c.to]);});
    return '<div class="brf-h"><b>Changed since the last refresh</b><span>'+b.E(CHG.from.slice(0,10))+' → '+b.E(CHG.to.slice(0,10))+'</span></div><div class="brf-note">'
      +'<b>'+CHG.calls.length+' call changes:</b> '+calls.slice(0,12).map(function(c){return b.tk(c.t)+' '+up(c.from)+'→<b>'+up(c.to)+'</b>';}).join(', ')+(calls.length>12?' +'+(calls.length-12)+' more':'')
      +'<br><b>Biggest moves:</b> '+CHG.moves.slice(0,8).map(function(m){return b.tk(m.t)+' <span class="'+b.PC(m.r)+'">'+b.P(m.r)+'</span>';}).join(', ')
      +(CHG.catalysts.length?'<br><b>Catalyst dates moved:</b> '+CHG.catalysts.slice(0,8).map(function(c){return b.tk(c.t)+' '+b.E(c.from||'—')+'→'+b.E(c.to||'—');}).join(', '):'<br><b>Catalyst dates moved:</b> none')
      +(CHG.new.length?'<br><b>Added:</b> '+CHG.new.map(b.tk).join(' '):'')+(CHG.dropped.length?'<br><b>Dropped:</b> '+CHG.dropped.map(function(t){return b.E(t);}).join(' '):'')+'</div>';};
  // ================= 5. Returns over time (top of Areas) =================
  var ROT={hide:{},hl:'',per:12,sel:null};   // per = quarters shown (2 = 6 months ... 12 = 3 years)
  function series(filter){var P=(S().J('priceq-baked')||{}),Q=P.quarters||[],PR=P.prices||{};var n=Q.length,start=Math.max(1,n-ROT.per);var idx=[100],labs=[Q[start-1]];
    var tks=B().DA.filter(filter).map(function(r){return r.ticker;});
    for(var i=start;i<n;i++){var rs=[];tks.forEach(function(t){var a=(PR[t]||[])[i-1],c=(PR[t]||[])[i];if(a>0&&c>0)rs.push(c/a);});var m=B().med(rs)||1;idx.push(idx[idx.length-1]*m);labs.push(Q[i]);}
    return {idx:idx,labs:labs};}
  function benchSeries(k){var T=B().TR||{},bq=T.bench_q;if(!bq)return null;var Q=bq.quarters,n=Q.length,start=Math.max(1,n-ROT.per),base=bq[k][start-1];if(!base)return null;var o=[100];for(var i=start;i<n;i++)o.push(bq[k][i]?bq[k][i]/base*100:null);return o;}
  function rotChart(){var b=B(),s=S(),U=series(function(r){return r.ta!=='Acquired / Inactive';}),X=benchSeries('XBI');
    var D=s.drillGroups(),lines;
    if(D.lev===3){   // one indication group: every company's line, the group median highlighted
      var P=(s.J('priceq-baked')||{}),Q=P.quarters||[],PR=P.prices||{},n0=Q.length,st=Math.max(1,n0-ROT.per);
      var col={l:'var(--long)',s:'var(--short)',a:'var(--amber)',n:'var(--faint)'},X0={};s.rows().forEach(function(x){X0[x.t]=x;});
      lines=D.items.map(function(it){var r=it.r,pr=PR[r.ticker]||[],base=null,v=[];for(var i=st-1;i<n0;i++){var p=pr[i];if(base==null&&p>0)base=p;v.push(base&&p>0?p/base*100:null);}var x=X0[r.ticker];return {l:r.ticker,v:v,c:col[x?x.side:'n'],w:1.6,o:.8,dk:r.ticker,dl:'co'};}).filter(function(l){return l.v.some(function(v){return v!=null;});});
